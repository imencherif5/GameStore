<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <link rel="stylesheet" href="/gamestorePHPversion/Styles.css" />
    <link rel="icon" href="/gamestorePHPversion/Assets/icon.png" type="image/png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body style="background-color: #4c6c8c">
    <section>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container">
                  <a class="navbar-brand d-flex align-items-center" href="/gamestorePHPversion/index.php">
                    <img src="/gamestorePHPversion/Assets/img1.png" alt="Game Store Logo" width="90" height="40" class="me-2">
                    <h2>GAME<sub>STORE</sub></h2>
                  </a>
              
                  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                  </button>
              
                  <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto align-items-center">
                      <li class="nav-item me-3">
                        <a class="nav-link" href="/gamestorePHPversion/index.php"><i class="bi bi-house fs-5"></i> Accueil</a>
                      </li>
                      <li class="nav-item">
                        <a class="btn btn-outline-light" href="/gamestorePHPversion/account/login.php"><i class="bi bi-person-circle"></i> Profil</a>
                      </li>
                    </ul>
                  </div>
                </div>
              </nav>
        </header>
        <div id="games">
          <div class="container my-4">
            <form class="d-flex justify-content-center" role="search">
              <input class="form-control me-2 w-50" type="search" id="search-text" placeholder="Rechercher un jeu..." aria-label="Search">
              <button class="btn btn-outline-primary" type="button" id="btn">
                <i class="bi bi-search"></i>
              </button>
            </form>
          </div>
          
          <div class="container my-5">
            <h2 class="text-center text-white mb-4">Mon Panier</h2>
            <div id="cart-items" class="text-white"></div>
            <h4 id="total-price" class="text-white mt-4"></h4>
            
          </div>
          
            <div id="products-box" style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
                gap: 1.5rem;
                margin-top: 40px;
          "></div>
        </div>
    </section>

    <div class="d-flex justify-content-center my-4">
      <a href="/gamestorePHPversion/coordonnees.php" class="btn btn-primary btn-lg">Acheter</a>
    </div>



    <script>
      let dataFromLocal = JSON.parse(localStorage.getItem("Data")) || [];
      const Box = document.getElementById("products-box");
      const totalPriceElement = document.getElementById("total-price");
    
      Box.innerHTML = "";
    
      let total = 0;
    
      dataFromLocal.forEach((e) => {
          const price = parseFloat(e.price.replace(",", ".").replace("$", ""));
          if (!isNaN(price)) total += price;
    
          Box.innerHTML += `
              <figure>
                  <img src="${e.img}" />
                  <figcaption>
                      ${e.Nom}<br /> ${e.price}<br />
                      <button class="btn btn-danger btn-sm" onclick="removeFromData(${e.id})">Remove</button>
                      <a href="/gamestorePHPversion/product.php?id=${e.id}">see more</a>
                  </figcaption>
              </figure>`;
      });
    
      if (totalPriceElement) {
        totalPriceElement.textContent = "Total : " + total.toFixed(2) + "$";
      }
    
      // Sauvegarde dans localStorage
      localStorage.setItem("total", total.toFixed(2));
    


      function removeFromData(id) {
          const indexToRemove = dataFromLocal.findIndex(item => item.id === id);
          
          if (indexToRemove !== -1) {
              dataFromLocal.splice(indexToRemove, 1);
              localStorage.setItem("Data", JSON.stringify(dataFromLocal));
              window.location.reload();
          }
          alert("produit supprimé!");
      }
    </script>    
  
</body>

</html>
